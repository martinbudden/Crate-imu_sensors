[package]
name = "imu-sensors"
version = "0.1.2"
edition = "2024"
authors = ["Martin Budden"]
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/martinbudden/crate-imu-sensors"
description = "Drivers for a variety of IMU sensors."
keywords = ["IMU", "gyro", "gyroscope", "accelerometer", "no_std"]
categories = [
    "embedded",
    "mathematics",
    "no-std",
    "science::robotics",
    "aerospace::drones",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--html-in-header", "katex-header.html"]

[build-dependencies]
rustc_version = "0.4.1"

[features]
#default = ["libm", "rp2040", "spi"]
#default = ["rp2040", "i2c"]
default = ["libm"]
#default = ["std"]
std = ["embassy-time/std", "embassy-executor/platform-std", "vqm/std"]
libm = ["dep:libm", "vqm/libm"]
no_align = ["vqm/no_align"]
simd = ["vqm/simd"]

#rp2040 = ["embassy-rp"]
rp2040 = ["embassy-rp/rp2040"]
rp2350 = ["embassy-rp/rp235xa", "embassy-rp/binary-info"] # 'rp235xa' is the 30-GPIO Pico 2 variant
embassy-rp = ["dep:embassy-rp"]
embassy-stm32 = ["dep:embassy-stm32"]
# esp32 = ["esp-hal", "esp-hal-embassy", "esp-backtrace", "esp-println"]
i2c = []
spi = []
lsmds63tr_c = []
ism330dhcx = []
lsm6dsox = []
axes_xpos_ypos_zpos = []
axes_yneg_xpos_zpos = []

# Hardware-specific Embassy HAL (example for Raspberry Pi RP2040)
# embassy-rp = { version = "0.10.0", optional= true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl"] }
# embassy-stm32 = { version = "0.5.0", optional = true, features = ["stm32f4xx", "time-driver"] } 


[dependencies.embassy-rp]
optional = true
version = "0.10.0"
features = ["time-driver"]

[dependencies.embassy-stm32]
optional = true
version = "0.6.0"

[dependencies.esp-idf-hal]
optional=true
version = "0.46.2"

[dependencies]
libm = { version = "0.2.16", optional = true }
serde = { version = "1.0.228", default-features = false, features = ["derive"], optional = true }
postcard = { version = "1.1.3", default-features = false, features = ["embedded-io"], optional = true }
vqm = { version = "0.1.9" }
#vqm = { git = "https://github.com/martinbudden/crate-vector-quaternion-matrix" }
#vqm = { path = "../vqm" }

embassy-time = {version = "0.5.1", default-features = false}
embassy-executor = { version = "0.10.0", features = ["executor-thread"] }
embassy-sync = "0.8.0"

# Use embedded-hal for I2C/SPI traits
embedded-hal = "1.0.0"
# Example: Add a specific sensor driver if needed
# mpu9250 = "0.25.0"
# bmi160 = "0.3.0"
# imu-fusion = "0.2.6"
# imu-calib = "0.1.0"   
# Embedded HAL traits (often re-exported by embassy-rp)
embedded-hal-async = "1.0.0"

# For logging and panic handling
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
# STM32/RP2040 logging
defmt = "1.0.1"
defmt-rtt = "1.2.0"
# ESP32 logging
# esp-println = { version = "0.17.0", optional = true, features = ["log"] }


log = "0.4.29"
cfg-if = "1.0.4"
strum = "0.28.0"
strum_macros = "0.28.0"
# For easy flash access on the RP2040
#embedded-storage = "0.3.1"
num_enum = "0.7.6"

[dev-dependencies]
pollster = "0.4.0"

# see https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
opt-level = 0
debug = "line-tables-only"
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = true
overflow-checks = true
lto = false
panic = 'unwind'
incremental = true
codegen-units = 256
rpath = false

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
debug = false
#split-debuginfo = '...'  # Platform-specific.
strip = "none"
debug-assertions = false
overflow-checks = false
lto = false
panic = 'abort'
incremental = false
codegen-units = 16
rpath = false

[profile.release-lto]
inherits = "release"
lto = true
